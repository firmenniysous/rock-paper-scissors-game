<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors game</title>
    <link rel="stylesheet" href="styles-ru.css">
    <script src="script-ru.js" defer></script>
</head>
<body>
    <main>
        <h1>Камень, ножницы, бумага</h1>
        <p id="instruction">Чтобы начать игру, нажмите <strong>СТАРТ</strong>.</p>
        
        <button id="start-game">СТАРТ</button>
        
        <div id="rps"></div>
        
        <div id="winnings-box">
            <div id="human-winnings" class="winnings">Ваши победы: 0</div>
            <div id="computer-winnings" class="winnings">Победы ИИ: 0</div>
        </div>
        <button id="choose-language">
        <figure id="choose-language-figure">
            <img src="../images/icons8-language-48.png" alt="image for choosing language">
            <figcaption>Выбрать другой язык</figcaption>
        </figure>
        </button>
    </main>
    <footer>&copy;2026 А.Гурбанов. Все права защищены.</footer>
</body>
</html>
